# k8s/non-argorollout-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-api
  namespace: teams-api
  labels:
    app: teams-api
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-api
  template:
    metadata:
      labels:
        app: teams-api
        component: backend
    spec:
      containers:
      - name: teams-api
        image: kitzingmarko/teams-api:v1.0.3
        ports:
        - containerPort: 8000
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
# non-argorollout-deployment.yaml
apiVersion: v1
kind: Service
metadata:
  name: teams-api-service
  namespace: teams-api
  labels:
    app: teams-api
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 4200
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: teams-api