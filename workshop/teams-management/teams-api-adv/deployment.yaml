apiVersion: v1
kind: Namespace
metadata:
  name: teams-api-adv
---
apiVersion: v1
kind: Secret
metadata:
  name: teams-api-adv-db
  namespace: teams-api-adv
type: Opaque
stringData:
  POSTGRES_DB: teams_api_adv
  POSTGRES_USER: teams_api_adv
  POSTGRES_PASSWORD: teams-api-adv-demo-only
---
apiVersion: v1
kind: Service
metadata:
  name: teams-api-adv-postgres-headless
  namespace: teams-api-adv
spec:
  clusterIP: None
  selector:
    app: teams-api-adv-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: teams-api-adv-postgres
  namespace: teams-api-adv
spec:
  selector:
    app: teams-api-adv-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: teams-api-adv-postgres
  namespace: teams-api-adv
spec:
  serviceName: teams-api-adv-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: teams-api-adv-postgres
  template:
    metadata:
      labels:
        app: teams-api-adv-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
      - name: set-postgres-volume-ownership
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: teams-api-adv-db
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: teams-api-adv-db
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: teams-api-adv-db
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "teams_api_adv", "-d", "teams_api_adv"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "teams_api_adv", "-d", "teams_api_adv"]
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-api-adv
  namespace: teams-api-adv
  labels:
    app: teams-api-adv
  annotations:
    commit-sha: 8b514a1cb354
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teams-api-adv
  template:
    metadata:
      labels:
        app: teams-api-adv
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-postgres
        image: postgres:15
        command:
        - sh
        - -c
        - until pg_isready -h teams-api-adv-postgres -p 5432 -U teams_api_adv -d teams_api_adv; do sleep 2; done
      containers:
      - name: teams-api-adv
        image: teams-api-adv:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: DB_HOST
          value: teams-api-adv-postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: teams-api-adv-db
              key: POSTGRES_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: teams-api-adv-db
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: teams-api-adv-db
              key: POSTGRES_PASSWORD
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: teams-api-adv-service
  namespace: teams-api-adv
spec:
  selector:
    app: teams-api-adv
  ports:
    - protocol: TCP
      port: 4200
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teams-api-adv-ingress
  namespace: teams-api-adv
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Requested-With"
spec:
  ingressClassName: nginx
  rules:
  - host: teams-api-adv.127.0.0.1.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: teams-api-adv-service
            port:
              number: 4200
